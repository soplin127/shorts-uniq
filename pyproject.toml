[project]
name = "shorts-uniq"
version = "0.1.0"
description = "Batch uniqualization of short vertical videos for TikTok and YouTube Shorts"
requires-python = ">=3.11"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]
whisper = ["faster-whisper>=1.0"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
